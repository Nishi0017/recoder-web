<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recoder 更新</title>
<style>body{background:#111;color:#fff;font:17px system-ui;max-width:36em;margin:3em auto;padding:1.5em;line-height:1.8}button{font:inherit;padding:1em;border-radius:12px;border:0}#status{white-space:pre-wrap}</style>
<h1>Recoder 更新</h1>
<p>録画を停止してから、インターネットに接続した状態で更新してください。保存済みの録画は削除しません。</p>
<button id="update">最新版に更新</button><p id="status" role="status"></p>
<script>
const button=document.querySelector('#update'), status=document.querySelector('#status');
function version(worker){return new Promise(resolve=>{if(!worker)return resolve(null);const channel=new MessageChannel();const timer=setTimeout(()=>resolve(null),1500);channel.port1.onmessage=e=>{clearTimeout(timer);resolve(e.data.revision);};worker.postMessage({type:'GET_VERSION'},[channel.port2]);});}
button.onclick=async()=>{
 button.disabled=true;status.textContent='最新版を準備しています。しばらくお待ちください…';
 try{
  if(!('serviceWorker' in navigator))throw new Error('このブラウザでは更新できません。Safariで開いてください。');
  const registration=await navigator.serviceWorker.register('ServiceWorker.js',{updateViaCache:'none'});
  await registration.update();
  const deadline=Date.now()+120000;
  while(Date.now()<deadline){
   if(await version(registration.active)==='10'){location.replace('./');return;}
   if(registration.waiting && await version(registration.waiting)==='10')registration.waiting.postMessage({type:'ACTIVATE_UPDATE'});
   await new Promise(resolve=>setTimeout(resolve,500));
  }
  throw new Error('更新に時間がかかっています。接続を確認して、もう一度お試しください。');
 }catch(error){status.textContent=error.message;button.disabled=false;}
};
</script></html>
